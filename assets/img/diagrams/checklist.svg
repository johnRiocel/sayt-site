<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400" role="img" aria-labelledby="checklistTitle">
<title id="checklistTitle">Diagram of a checklist with four items cycling between pending, OK, Fail and N/A</title>
<rect x="1" y="1" width="698" height="398" rx="20" fill="#fff" stroke="#E5E7EB"/>

<text x="40" y="50" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#6B7280" letter-spacing="0.06em">PRE-VISIT CHECKLIST</text>

<!-- row 1 -->
<rect x="40" y="70" width="620" height="60" rx="12" fill="#F9FAFB" stroke="#E5E7EB"/>
<text x="60" y="105" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#0B1220">Fire extinguishers in place and tagged</text>
<rect x="560" y="85" width="80" height="30" rx="15" fill="#ECFDF5" stroke="#A7F3D0"/>
<text x="578" y="105" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="13" fill="#059669" font-weight="700">OK</text>

<!-- row 2 -->
<rect x="40" y="140" width="620" height="60" rx="12" fill="#F9FAFB" stroke="#E5E7EB"/>
<text x="60" y="175" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#0B1220">Exit signage illuminated</text>
<rect x="555" y="155" width="90" height="30" rx="15" fill="#FEF2F2" stroke="#FCA5A5"/>
<text x="570" y="175" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="13" fill="#DC2626" font-weight="700">Fail</text>

<!-- row 3 -->
<rect x="40" y="210" width="620" height="60" rx="12" fill="#F9FAFB" stroke="#E5E7EB"/>
<text x="60" y="245" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#0B1220">Emergency lighting tested</text>
<rect x="555" y="225" width="90" height="30" rx="15" fill="#F3F4F6" stroke="#E5E7EB"/>
<text x="580" y="245" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="13" fill="#6B7280" font-weight="700">N/A</text>

<!-- row 4 -->
<rect x="40" y="280" width="620" height="60" rx="12" fill="#F9FAFB" stroke="#E5E7EB"/>
<text x="60" y="315" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#0B1220">Sprinkler heads unobstructed</text>
<rect x="530" y="295" width="115" height="30" rx="15" fill="#fff" stroke="#E5E7EB" stroke-dasharray="4 3"/>
<text x="548" y="315" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="13" fill="#9CA3AF" font-weight="700">Pending</text>

<!-- cycle indicator -->
<path d="M 40 360 A 20 20 0 1 1 80 360" fill="none" stroke="#059669" stroke-width="2.5"/>
<polygon points="80,360 74,350 88,353" fill="#059669"/>
<text x="95" y="365" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="12" fill="#6B7280">Tap to cycle: Pending → OK → Fail → N/A</text>
</svg>
