<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400" role="img" aria-labelledby="obsIssueTitle">
<title id="obsIssueTitle">Diagram of an observation being promoted to a tracked issue with a status timeline</title>
<rect x="1" y="1" width="698" height="398" rx="20" fill="#fff" stroke="#E5E7EB"/>

<!-- Observation card -->
<rect x="40" y="60" width="260" height="280" rx="16" fill="#F9FAFB" stroke="#E5E7EB"/>
<text x="60" y="92" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#6B7280" letter-spacing="0.06em">OBSERVATION</text>

<rect x="60" y="110" width="90" height="30" rx="15" fill="#ECFDF5" stroke="#A7F3D0"/>
<text x="75" y="130" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="13" fill="#059669" font-weight="600">Positive</text>

<rect x="60" y="150" width="90" height="30" rx="15" fill="#F9FAFB" stroke="#E5E7EB"/>
<text x="80" y="170" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="13" fill="#6B7280" font-weight="600">Neutral</text>

<rect x="60" y="190" width="100" height="30" rx="15" fill="#FEF2F2" stroke="#FCA5A5"/>
<text x="76" y="210" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="13" fill="#DC2626" font-weight="600">Negative</text>

<text x="60" y="250" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#0B1220" font-weight="600">Damp staining,</text>
<text x="60" y="270" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#0B1220" font-weight="600">store room ceiling</text>
<text x="60" y="295" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="12" fill="#6B7280">Category: Waterproofing</text>

<!-- promote arrow -->
<line x1="310" y1="200" x2="380" y2="200" stroke="#059669" stroke-width="3"/>
<polygon points="380,200 366,192 366,208" fill="#059669"/>
<text x="317" y="185" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="12" fill="#059669" font-weight="700">PROMOTE</text>

<!-- Issue card -->
<rect x="395" y="60" width="265" height="280" rx="16" fill="#ECFDF5" stroke="#A7F3D0"/>
<text x="415" y="92" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#059669" letter-spacing="0.06em">ISSUE</text>

<text x="415" y="120" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#0B1220" font-weight="600">Damp staining,</text>
<text x="415" y="140" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#0B1220" font-weight="600">store room ceiling</text>

<!-- status timeline -->
<circle cx="425" cy="185" r="7" fill="#059669"/>
<line x1="425" y1="192" x2="425" y2="220" stroke="#A7F3D0" stroke-width="3"/>
<text x="440" y="190" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="12" fill="#374151">Open — Visit 2</text>

<circle cx="425" cy="228" r="7" fill="#059669"/>
<line x1="425" y1="235" x2="425" y2="263" stroke="#A7F3D0" stroke-width="3"/>
<text x="440" y="233" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="12" fill="#374151">In progress — Visit 3</text>

<circle cx="425" cy="271" r="7" fill="none" stroke="#059669" stroke-width="2"/>
<text x="440" y="276" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="12" fill="#6B7280">Re-check due — Visit 4</text>

<rect x="415" y="295" width="225" height="30" rx="8" fill="#fff" stroke="#A7F3D0"/>
<!-- camera icon -->
<rect x="428" y="307" width="20" height="15" rx="2" fill="none" stroke="#374151" stroke-width="1.6"/>
<rect x="435" y="303" width="7" height="5" rx="1" fill="none" stroke="#374151" stroke-width="1.4"/>
<circle cx="438" cy="314" r="4.5" fill="none" stroke="#374151" stroke-width="1.4"/>
<text x="456" y="318" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="12" fill="#374151">Verification photo required</text>
</svg>
